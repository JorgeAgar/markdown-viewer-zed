[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
description = "A tiny, fast-starting, GPU-rendered Markdown viewer built on GPUI (Zed's UI framework)"
license = "Apache-2.0"

[workspace]
members = [".", "crates/mdview-core"]
# The vendored GPUI is a patch, not part of mdview's own code: keep it out of
# workspace-wide fmt, clippy and tests. fuzz/ needs libFuzzer and its own
# build flags (see fuzz/README.md).
exclude = ["crates/gpui", "fuzz"]

[dependencies]
mdview-core = { path = "crates/mdview-core" }
gpui = "0.2.2"
futures = "0.3"
# Already in GPUI's tree; blocking transport runs on smol's blocking pool.
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
smol = "2"
# Display math: RaTeX (a Rust port of KaTeX), with the KaTeX fonts embedded.
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-types = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
# Mermaid diagrams: merman, the Rust Mermaid implementation Zed uses. No ELK
# layout; native-fonts measures labels with the UI font (see graphics.rs).
merman = { version = "0.9.3", default-features = false, features = ["svg", "all-diagrams", "layout-cytoscape", "native-fonts"] }
serde_json = "1"
# Already in GPUI's dependency tree (same versions and features): rasterize
# math SVGs and hand the pixels to GPUI.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
image = { version = "0.25", default-features = false }
ttf-parser = "0.25"

# Native IPC reuses GPUI's Windows API crate; no Linux dependency change.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
# Golden images for display math (src/graphics/tests.rs). Already compiled
# in through GPUI, with these features; listed so the tests don't rely on it.
image = { version = "0.25", default-features = false, features = ["png"] }
# Headless GPUI (TestAppContext, test platform) for the Viewer tests in
# src/viewer/app_tests.rs. Dev-dependency features aren't unified into
# `cargo build --release` (resolver 3), so none of it reaches the binary.
gpui = { version = "0.2.2", features = ["test-support"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Not "abort": graphics.rs catches panics from the math/diagram renderers.
panic = "unwind"
strip = true

# Fast iteration builds that still feel snappy.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# CI (scripts/check.sh --profile ci): compile time matters more than run time,
# since a cold build of GPUI and its dependencies on a 2-core runner dominates.
# Unoptimized dependencies and no debug info cut the compile work about 5x
# versus the dev profile; the whole test suite still runs in about 10 s.
[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 0

# Vendored GPUI 0.2.2 with mdview's startup fixes (see crates/gpui/MDVIEW.md).
[patch.crates-io]
gpui = { path = "crates/gpui" }
