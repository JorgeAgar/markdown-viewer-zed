[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
description = "A tiny, fast-starting, GPU-rendered Markdown viewer built on GPUI (Zed's UI framework)"
license = "Apache-2.0"

[workspace]
members = [".", "crates/mdview-core"]
# The vendored GPUI is a patch, not part of mdview's own code: keep it out of
# workspace-wide fmt, clippy and tests.
exclude = ["crates/gpui"]

[dependencies]
mdview-core = { path = "crates/mdview-core" }
gpui = "0.2.2"
futures = "0.3"
# Display math: RaTeX (a Rust port of KaTeX), with the KaTeX fonts embedded.
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-types = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
# Mermaid diagrams: merman, the Rust Mermaid implementation Zed uses. No ELK
# layout; native-fonts measures labels with the UI font (see graphics.rs).
merman = { version = "0.9.3", default-features = false, features = ["svg", "all-diagrams", "layout-cytoscape", "native-fonts"] }
serde_json = "1"
# Already in GPUI's dependency tree (same versions and features): rasterize
# math SVGs and hand the pixels to GPUI.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
image = { version = "0.25", default-features = false }
ttf-parser = "0.25"

[dev-dependencies]
# Golden images for display math (src/graphics/tests.rs). Already compiled
# in through GPUI, with these features; listed so the tests don't rely on it.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Not "abort": graphics.rs catches panics from the math/diagram renderers.
panic = "unwind"
strip = true

# Fast iteration builds that still feel snappy.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Vendored GPUI 0.2.2 with mdview's startup fixes (see crates/gpui/MDVIEW.md).
[patch.crates-io]
gpui = { path = "crates/gpui" }
