name: Windows build, installer and portable executable
on:
  workflow_call:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64
          cache-on-failure: true
      - name: Full headless workspace tests
        run: cargo test --locked --workspace --profile ci
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings
      - name: Build optimized DirectX application
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Native GUI presentation, startup and theme evidence
        run: python scripts/validation/native_gui.py target/x86_64-pc-windows-msvc/release/mdview.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gui-windows
          path: target/native-validation/
          if-no-files-found: warn
      - name: Package installer and portable executable
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'mdview').version
          $source = Join-Path $env:GITHUB_WORKSPACE 'target/x86_64-pc-windows-msvc/release'
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$source" packaging/windows/mdview.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Copy-Item (Join-Path $source 'mdview.exe') "packaging/windows/dist/mdview-v$version-windows-x86_64-portable.exe"
      - name: Test portable executable without installation
        shell: pwsh
        run: |
          $portable = Get-Item packaging/windows/dist/*-portable.exe
          $testDir = Join-Path $env:RUNNER_TEMP 'mdview portable test'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          $exe = Join-Path $testDir $portable.Name
          Copy-Item $portable.FullName $exe
          $help = Join-Path $testDir 'help.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--help' -WorkingDirectory $testDir -RedirectStandardOutput $help -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Select-String 'USAGE' $help -Quiet)) { throw 'Portable help smoke test failed' }
      - name: Test install, upgrade, help and uninstall
        shell: pwsh
        run: |
          $installer = (Get-ChildItem packaging/windows/dist/*-setup.exe).FullName
          ./packaging/windows/smoke.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: packaging/windows/dist/*.exe
          if-no-files-found: error
