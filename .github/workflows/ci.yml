name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Goal: under 10 minutes even with an empty cache. Almost all of a cold run is
# compiling GPUI and its dependencies on a 2-core runner, so: the `ci` cargo
# profile (dependencies unoptimized, no debug info: ~5x less compile work than
# the dev profile), one build per job, and clippy in a parallel job.
# Caches are saved only from main: PRs restore main's cache but don't save
# their own, which would push main's out of the repo's 10 GB cache limit.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Build-time and runtime libraries GPUI needs on Linux: xkbcommon and xcb
  # are linked; fontconfig, freetype, Wayland and the Vulkan loader are
  # loaded or built against.
  GPUI_DEPS: >-
    pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev
    libfontconfig-dev libfreetype-dev libvulkan1

jobs:
  test:
    name: fmt, guards, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $GPUI_DEPS \
            fonts-dejavu-core
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: scripts/check.sh (fmt, guards, all tests)
        run: scripts/check.sh --profile ci --no-clippy

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GPUI_DEPS
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy -D warnings
        run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings

  # The Windows and macOS jobs take 6-20 minutes, mostly an optimized fat-LTO
  # build that the cache barely shortens. On pull requests they run only when
  # the PR touches code or files that are platform-specific or change what
  # gets built; pushes to main and manual runs always run them.
  native-changes:
    name: decide native jobs
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR's merge commit; its first parent is the base branch.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"; echo "$changed"
          pattern='^(src/platform/|crates/gpui/|patches/|packaging/|scripts/validation/|assets/icon\.|build\.rs$|rust-toolchain\.toml$|Cargo\.(lock|toml)$|crates/[^/]+/Cargo\.toml$|tests/windows_cli\.rs$|\.gitattributes$|\.github/workflows/(ci|windows|macos)\.yml$)'
          if grep -qE "$pattern" <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No platform, packaging or dependency changes: skipping the Windows and macOS jobs."
          fi

  native-windows:
    needs: native-changes
    if: needs.native-changes.outputs.run == 'true'
    uses: ./.github/workflows/windows.yml

  native-macos:
    needs: native-changes
    if: needs.native-changes.outputs.run == 'true'
    uses: ./.github/workflows/macos.yml
