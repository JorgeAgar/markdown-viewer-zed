name: macOS Apple Silicon build and DMG
on:
  workflow_call:
    inputs:
      # Developer ID sign and notarize when the credentials are configured;
      # without them the DMG is ad-hoc signed (unnotarized) and a warning is
      # emitted. A partially configured set of credentials fails the job.
      sign:
        type: boolean
        default: false
    secrets:
      MACOS_CERTIFICATE_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false

env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64-apple-darwin
          cache-on-failure: true
      - name: Full native headless tests
        run: cargo test --locked --workspace --profile ci
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings
      - name: Build optimized Metal application
        run: cargo build --locked --release --target 'aarch64-apple-darwin'
      - name: Native GUI presentation, startup and theme evidence
        run: python3 scripts/validation/native_gui.py target/aarch64-apple-darwin/release/mdview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gui-aarch64-apple-darwin
          path: target/native-validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bin-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/mdview
          if-no-files-found: error

  package:
    name: Package and verify Apple Silicon DMG
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SIGNING_ENABLED: ${{ inputs.sign && secrets.MACOS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-bin-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release
      - name: Warn about unsigned release DMG
        if: inputs.sign && env.SIGNING_ENABLED != 'true'
        run: echo "::warning::macOS signing secrets are not configured; publishing an ad-hoc-signed, unnotarized DMG."
      - name: Import release signing credentials
        if: env.SIGNING_ENABLED == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [[ -n ${!name} ]] || { echo "Missing release signing credential: $name" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/mdview.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/mdview.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/mdview.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials mdview-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/mdview.p12"
      - name: Package and smoke test DMG
        env:
          RELEASE_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          chmod +x target/*-apple-darwin/release/mdview
          if [[ $SIGNING_ENABLED == true ]]; then
            export MACOS_SIGN_IDENTITY="$RELEASE_IDENTITY"
          fi
          # Cargo.toml is authoritative; the plist is a packaging template.
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          packaging/macos/package.sh "$version"
      - name: Remove signing keychain
        if: always() && env.SIGNING_ENABLED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/mdview.keychain-db" || true
          rm -f "$RUNNER_TEMP/mdview.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error
