[package]
name = "mdview-core"
version = "0.1.1"
edition = "2024"
description = "mdview's GUI-free core: Markdown parsing, syntax highlighting and inline LaTeX"
license = "Apache-2.0"
publish = false

# This crate must never depend on GPUI (or anything else UI-related): keeping
# it separate makes the compiler enforce that, and lets its tests build and
# run in seconds.
[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }

# Test-only: none of these end up in the mdview binary.
[dev-dependencies]
insta = { version = "1.43", features = ["glob"] }
proptest = "1"
serde_json = "1"
